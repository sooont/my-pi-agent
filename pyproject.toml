[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-pi-agent"
version = "0.2.0"
description = "Minimalist Pi-style coding-agent framework and CLI with Pi-TUI"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.50.0",
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0",
    "mcp>=2.0.0,<2.1",
    "filelock>=3.32.6",
    "pillow>=10.0",
]

[project.scripts]
my-pi-agent = "my_coding_agent.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/my_agent_llm",
    "src/my_agent_core",
    "src/my_coding_agent",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pyright]
extraPaths = ["src", "."]
